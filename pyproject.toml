[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vast-gpu-automation"
version = "0.1.0"
description = "Vast.ai GPU automation helpers for on-demand training services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "vastai-sdk>=0.1.0",
  "python-dotenv>=1.0.0",
]

[tool.setuptools]
py-modules = ["vast_service", "vast_gpu_manager"]

[tool.setuptools.packages.find]
where = ["."]
include = ["services*"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=services --cov-report=term-missing --cov-fail-under=60"

[tool.coverage.run]
omit = ["venv/*", "tests/*", "*/examples/*", "*/workflow.py"]
